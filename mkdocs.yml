site_name: 学習ノート
site_url: https://shizu-na.github.io/notebook/
repo_url: https://github.com/shizu-na/notebook
repo_name: shizu-na/notebook
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# ナビゲーション（サイドバー／タブ）
# 新しいテーマを追加したら、ここに項目を足してください。
nav:
  - ホーム: index.md
  - 飯高予想:
      - iitaka/index.md
      - 第0部 線形代数と微積分の再構築:
          - 0-1. 線形代数の本質: iitaka/0/0-1.md
          - 0-2. 商空間: iitaka/0/0-2.md
          - 0-3. 双対空間: iitaka/0/0-3.md
          - 0-4. 多変数微積分の本質: iitaka/0/0-4.md
      - 第1部 代数学の基礎:
          - 1-1. 群・環・体の基礎: iitaka/1/1-1.md
          - 1-2. 多項式環とイデアル: iitaka/1/1-2.md
          - 1-3. 剰余環と準同型定理: iitaka/1/1-3.md
          - 1-4. 素イデアルと極大イデアル: iitaka/1/1-4.md
          - 1-5. 体の拡大と超越次数: iitaka/1/1-5.md
      - 第2部 位相空間と多様体:
          - 2-1. 距離空間から位相空間へ: iitaka/2/2-1.md
          - 2-2. 多様体の定義と局所座標系: iitaka/2/2-2.md
          - 2-3. 接空間とベクトル場: iitaka/2/2-3.md
          - 2-4. 微分形式と外積代数: iitaka/2/2-4.md
          - 2-5. 射影空間の構成: iitaka/2/2-5.md
      - 第3部 複素解析とリーマン面:
          - 3-1. 1変数複素関数と正則性: iitaka/3/3-1.md
          - 3-2. 有理型関数（零点と極）: iitaka/3/3-2.md
          - 3-3. コンパクト・リーマン面と種数: iitaka/3/3-3.md
          - 3-4. 因子と線形系: iitaka/3/3-4.md
          - 3-5. リーマン・ロッホの定理: iitaka/3/3-5.md
      - 第4部 代数幾何学の基礎:
          - 4-1. アフィン代数多様体と零点定理: iitaka/4/4-1.md
          - 4-2. ザリスキ位相: iitaka/4/4-2.md
          - 4-3. 射影代数多様体とベズーの定理: iitaka/4/4-3.md
          - 4-4. 射・有理写像・双有理同値: iitaka/4/4-4.md
          - 4-5. 特異点と非特異性: iitaka/4/4-5.md
      - 第5部 層・直線束・コホモロジー:
          - 5-1. 層と前層の概念: iitaka/5/5-1.md
          - 5-2. ベクトル束と直線束: iitaka/5/5-2.md
          - 5-3. 層のコホモロジー群: iitaka/5/5-3.md
      - 第6部 飯高次元・飯高ファイブレーション・飯高予想:
          - 6-1. 飯高次元の厳密な定義と基本性質: iitaka/6/6-1.md
          - 6-2. 小平次元による多様体の分類: iitaka/6/6-2.md
          - 6-3. 飯高ファイブレーションの定理: iitaka/6/6-3.md
          - 6-4. 飯高予想の定式化と現在地: iitaka/6/6-4.md
  - 4次元以上の幾何学:
      - seeing-4d/index.md
      - 第0部 高次元空間の土台:
          - 0-1. 高次元空間の内積・距離・直交性: seeing-4d/0/0-1.md
          - 0-2. 直交行列と高次元の回転（SO(3)とSO(4)）: seeing-4d/0/0-2.md
          - 0-3. 商位相と空間の貼り合わせ: seeing-4d/0/0-3.md
          - 0-4. 対称性と群の作用: seeing-4d/0/0-4.md
      - 第1部 影を落とす（射影の幾何）:
          - 1-1. アフィン空間・重心座標・平行投影: seeing-4d/1/1-1.md
          - 1-2. 透視図法と射影空間 RP², RP³: seeing-4d/1/1-2.md
          - 1-3. 複比と射影双対: seeing-4d/1/1-3.md
          - 1-4. 4次元立体の影：シュレーゲル図: seeing-4d/1/1-4.md
      - 第2部 次元を落とすと何が壊れるか:
          - 2-1. 立体錯視と不可能図形: seeing-4d/2/2-1.md
          - 2-2. 写像の特異点とヤコビ行列: seeing-4d/2/2-2.md
          - 2-3. 4次元にしか埋め込めない曲面の3次元での姿: seeing-4d/2/2-3.md
      - 第3部 輪切りにして見る（断面とモース理論）:
          - 3-1. 2D平面で3D立体を切る: seeing-4d/3/3-1.md
          - 3-2. モース理論による形の復元: seeing-4d/3/3-2.md
          - 3-3. 3D空間で4D立体を切る: seeing-4d/3/3-3.md
      - 第4部 対称性と鏡で高次元を分類する:
          - 4-1. 凸多面体・双対・球面幾何: seeing-4d/4/4-1.md
          - 4-2. 万華鏡と鏡映群：コクセター図形: seeing-4d/4/4-2.md
          - 4-3. 4次元正多胞体と高次元正多胞体の完全分類: seeing-4d/4/4-3.md
      - 第5部 3次元球面 S³ の中を歩く:
          - 5-1. 立体射影: seeing-4d/5/5-1.md
          - 5-2. 回転の空間 SO(3) ≅ RP³ と皿のトリック: seeing-4d/5/5-2.md
          - 5-3. 四元数と2重被覆: seeing-4d/5/5-3.md
          - 5-4. ホップ・ファイブレーション: seeing-4d/5/5-4.md
      - 第6部 次元を上げると可能になること:
          - 6-1. 円の裏返しと球面の裏返し: seeing-4d/6/6-1.md
          - 6-2. 3次元の結び目と4次元での解消: seeing-4d/6/6-2.md
          - 6-3. 3次元多様体の貼り合わせと4次元の特異性: seeing-4d/6/6-3.md
